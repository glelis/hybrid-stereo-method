# Base CONGELADA do sweep v2 (2026-11-21), derivada do configs/hb_experiment.yaml
# de c9e100f + knobs median_ksize/smooth_sigma. Os configs do sweep são gerados
# a partir DESTE arquivo (configs/sweep_v2/stages.py): paths e pixel_size vêm
# de datasets.yaml; os overrides de cada estágio, de stages.py e centers/.
# max_iter/conv_tol fixados pela Task 5 (S0, convergência).
experiment:
  type: hybrid
  paths:
    input: null
    output: null
    data_folder: null
  settings:
    mask: false
    gabaritos: false
    debug: false
multifocus:
  parameters:
    interpolation: linear_interpolation
    z_foc: auto
  focus_measure:
    method: fourier
    parameters:
      kernel_size: 31
      radius: 0.05
    preprocessing:
      square: false
      smooth: true
      spatial_median_filter: true
      median_ksize: 5
      smooth_sigma: null
      zero_border: false
  optimization:
    r_max: 2
    polyfit_epsilon: 1.0e-09
  depth_refinement:
    enabled: false
    gaussian_size: 9
    unary_scale: 44
    pair_scale: 4096
    n_iter: 5
photometric:
  parameters:
    method: wodham_implementation_argmax
    data_scale: 1.0
    image_extension: png
  solver:
    epsilon: 1.0e-06
    shadow_threshold: 0.001
    top_k: 3
    outlier_threshold_multiplier: 3
hybrid:
  integration:
    initial_method: zero
    initial_noise: 0.0
    pixel_size: null
    use_hints: true
    hints_weight: 0.1
    max_level: 30
    max_iter: 5000
    conv_tol: 5.0e-07
    report_step: 0
    slopes_scale:
    - 1.0
    - -1.0
evaluation:
  enabled: true
  hdev_mask: false
  hdev_threshold: 0.1
  exclude_scale_band: true
  object_mask: true
