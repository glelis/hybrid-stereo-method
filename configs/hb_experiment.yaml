# Hybrid Stereo Experiment Configuration

experiment:
  # Experiment Type
  # options: "multifocus", "photometric", "hybrid"
  type: "hybrid"
  
  paths:
    # Path to the directory containing the input dataset
    input: 'data/raw/hybrid_stereo_new/'
    
    # Path to the directory where results will be saved
    output: 'data/results/hybrid_stereo/'
    
    # Name of the specific data folder to process
    #data_folder: '2025-03-08-stQ-melon24-amb0.00-glo0.50'
    data_folder: 'lamb-gls'

  settings:
    # Whether to use a specific mask
    # NOTE: not consumed by the pipeline yet (no entry point reads it)
    mask: False
    
    # Whether ground truth (gabaritos) are available for error calculation
    gabaritos: False
    
    # Enable debug mode for verbose logging and saving intermediate data
    debug: False

multifocus:
  parameters:
    # Method for interpolating focus values
    # Options: 'linear_interpolation', 'quadratic_interpolation', 'crop'
    interpolation: 'linear_interpolation'
    
    
    # Focal distances (Z coordinates) of each image in the stack.
    # 'auto' parses them from the zf<value>* folder names of the dataset
    # (e.g. lamb-gls: 7.2 … 288.8, step 25.6). An explicit list is validated
    # against those names and the run aborts on mismatch — a list from another
    # dataset puts zMos and the absolute integration hints in the wrong units.
    # melon24: [15.0, 25.0, 35.0, 45.0, 55.0, 65.0, 75.0, 85.0, 95.0, 105.0, 115.0, 125.0]
    z_foc: auto

  focus_measure:
    # Algorithm to measure focus
    # Options: 'fourier', 'laplacian', 'wavelet'
    method: 'fourier'
    
    parameters:
      # Size of the Laplacian kernel (if method is 'laplacian')
      kernel_size: 31
      
      # Radius for Fourier transform frequency masking (if method is 'fourier')
      radius: 0.05  # sweep 2026-07-10 winner (13_lowfreq_denoise_noborder); was 0.1
      
    preprocessing:
      # Whether to square the focus measure result
      square: False
      
      # Whether to smooth the focus measure result
      smooth: True
      
      # Whether to apply spatial median filter (cv2.medianBlur) on the focus measure
      spatial_median_filter: True
      
      # Whether to zero out the borders to avoid artifacts
      zero_border: False

  optimization:
    # Parameters for the Fuzzy Argmax algorithm
    
    # Radius of influence for the fuzzy regression
    r_max: 2
    
    # Epsilon value to determine if a curve is flat/convex for polyfit
    polyfit_epsilon: 1.0e-9

  # NOTE: this block is NOT consumed by the pipeline yet
  # (depth_refinement.py is not invoked by any entry point).
  depth_refinement:
    # Use spatial uncertainty from fuzzy argmax to guide a graph cut regularizer
    enabled: False
    gaussian_size: 9
    unary_scale: 44
    pair_scale: 4096
    n_iter: 5

photometric:
  parameters:
    # Solver method to use
    method: 'wodham_implementation_argmax'
    
    # Scale factor for input images
    data_scale: 1.0
    
    # Extension of input images
    image_extension: "png"
    
  solver:
    # Parameters for Weighted/Robust solvers
    
    # Small value to avoid division by zero
    epsilon: 1.0e-6
    
    # Minimum intensity ratio to consider a pixel not shadowed
    shadow_threshold: 1.0e-3
    
    # Number of brightest images to keep — consumed ONLY by the plain argmax
    # solver (estimate_normals_argmax). The hybrid pipeline uses the robust
    # solver, which ignores it (sweep 2026-07-10: top_k is a no-op here).
    top_k: 3
    
    # Multiplier for residual standard deviation to identify outliers
    outlier_threshold_multiplier: 3

hybrid:
  integration:
    # Integration method (starting point)
    initial_method: "zero"
    
    # Initial noise level
    initial_noise: 0.0
    
    # Lateral size of one pixel in the SAME units as z_foc. The slopes are
    # multiplied by it, so the integrated heights come out in z_foc units —
    # commensurable with the absolute multifocus hints (zMos). If unset, heights
    # stay in pixel units (incommensurable with the hints, INT-04/CONV-4) and a
    # warning is logged when use_hints is true. Depends on the dataset/camera:
    # melon24 was estimated empirically as 3.08 (investigation 2026-06-06, C3);
    # lamb-gls has not been measured yet.
    # pixel_size: 3.08

    # Whether to use the depth map from multifocus as hints
    use_hints: True
    
    # Weight for the hints map (0.0 to 1.0)
    hints_weight: 0.1
    
    # Maximum recursion level for the integration algorithm
    max_level: 30
    
    # Maximum iterations for the solver
    max_iter: 10000
    
    # Convergence tolerance
    conv_tol: 0.0000005

    # Axis signs [sx, sy] applied to dZ/dX and dZ/dY before integration
    # (multiplied by pixel_size above).
    # The FNI files are written top-down (OpenCV row order) while the C
    # integrator assumes origin at the bottom-left with Y pointing up, so
    # sy must be -1.0 for datasets whose lights/normals follow the Y-up
    # convention (Stolfi generators, e.g. melon24).
    slopes_scale: [1.0, -1.0]

evaluation:
  # Avaliação automática contra o ground truth ao final do pipeline
  # (também disponível standalone:
  #  python -m hybrid_stereo_method.evaluation.main --results_dir <pasta>)
  enabled: true

  # Também reportar métricas de altura excluindo pixels onde o próprio GT é
  # incerto (hDev.png alto). Threshold = fração do range do hDev acima da
  # qual o pixel é excluído.
  hdev_mask: false
  hdev_threshold: 0.1
