# Weighted Photometric Stereo Experiment Configuration

experiment:
  # Experiment Type
  # options: "multifocus", "photometric", "hybrid"
  type: "photometric"
  
  paths:
    # Path to the directory containing the input dataset
    input: '/home/lelis/Documents/Projetos/hybrid-stereo-method/data/raw/hybrid_stereo/2025-03-08-stQ-melon24-amb0.00-glo0.50/'
    
    # Path to the directory where results will be saved
    output: '/home/lelis/Documents/Projetos/hybrid-stereo-method/data/results/hybrid_stereo/'
    
    # Name of the specific data folder to process
    data_folder: 'images_ps'

  settings:
    # Enable debug mode
    debug: False
    mask: False
    gabaritos: False

photometric:
  parameters:
    # Solver method to use
    method: 'wodham_implementation_argmax'

    # Scale factor for input images
    data_scale: 1.0

    # Extension of input images
    image_extension: "png"

    # Gamma of the acquisition. The Lambertian model requires LINEAR
    # intensities (PS-08/CONV-5); 1.0 (default) means the sVal.png are already
    # linear. If they are sRGB/gamma-encoded, set the encoding gamma (e.g. 2.2)
    # to decode before solving.
    gamma: 1.0
    
  solver:
    # Parameters for Weighted/Robust solvers
    
    # Small value to avoid division by zero
    epsilon: 1.0e-6
    
    # Minimum intensity ratio to consider a pixel not shadowed
    shadow_threshold: 1.0e-3
    
    # Number of brightest images to keep for argmax method
    top_k: 3
    
    # Multiplier for residual standard deviation to identify outliers
    outlier_threshold_multiplier: 3

    # Absolute shadow threshold in the same intensity units as the input
    # images (0-255 for 8-bit data). Measurements below it are treated as
    # shadow and excluded (PS-02). ~2/255 rejects the 8-bit noise floor.
    shadow_absolute_threshold: 2.0

    # Upper threshold: measurements at/above it are treated as saturated and
    # excluded (PS-02). 250 leaves margin below the 255 clip.
    saturation_threshold: 250.0

    # One-sided saturation outlier cut (PS-03): overpredictions (I_pred - I_obs)
    # beyond median + k*1.4826*MAD of the overprediction subset are discarded.
    # Tighter than the symmetric outlier_threshold_multiplier because clipping
    # only ever lowers the observation. Lower values reject more aggressively.
    # Code-review proposed 2.0, but 1.5 and 2.0 break the saturation test
    # (8 lights, 2 saturated at 60%: 5.79° and 7.56° > 5° threshold).
    # Default 1.0 kept; trade-off requires a human decision before raising.
    saturation_outlier_multiplier: 1.0
